h:100%;border:1px solid var(--line);background:#ffffff0b;border-radius:11px;padding:11px}.field textarea{min-height:92px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.spread{justify-content:space-between}.result{margin-top:16px;padding:16px;border:1px solid #a597d83d;background:#a597d810;border-radius:15px}.result h3{margin:4px 0 7px}.signal{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}.signal:first-child{border-top:0}.signal span{color:var(--gold);font-weight:900}.signal p{margin:0;color:#c7d0cb;line-height:1.45}.draft{margin-top:13px;padding:13px;border-radius:12px;background:#0002}.draft p{white-space:pre-wrap;line-height:1.55}.hidden{display:none}.picker{display:grid;gap:9px}.pick{width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:13px;background:#ffffff08}.pick strong,.pick small{display:block}.pick small{color:var(--muted);margin-top:4px}.repair-step{display:grid;grid-template-columns:31px 1fr;gap:10px;margin-top:12px}.repair-step>span{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:#82d49f18;color:#bce9cb;font-weight:900}.record-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.record{padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff08}.record strong{display:block;margin-top:5px}.back{border:0;background:none;padding:0;color:#bce9cb;margin-bottom:20px}@media(max-width:900px){.hero{grid-template-columns:1fr}.grid4,.coach-grid{grid-template-columns:repeat(2,1fr)}.loop{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.mini{display:none}main{width:calc(100% - 18px);padding-top:18px}.hero{padding:24px 18px}.hero h1,.intro h1{font-size:42px}.grid4,.coach-grid,.loop,.form,.record-grid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:start;flex-direction:column}.modal-card{padding:18px}.modal-actions </style></head><body><div class="bg"></div><header><button class="brand" id="home"><span class="mark">C</span><span><strong>CharacterArc Coach</strong><small>Accountable action practice</small></span></button><div class="mini"><span>Say</span><i>→</i><span>Do</span><i>→</i><span>Did</span><i>→</i><span>Said</span></div></header><main id="root"></main><script>
const K='characterarc-coach-v1',L='characterarc-v1',D={commitments:[],history:[],coach:[]};let S=load();const R=document.getElementById('root');document.getElementById('home').onclick=dashboard;
function load(){try{let p=JSON.parse(localStorage.getItem(K)||localStorage.getItem(L)||'null');return p?{...D,...p,commitments:(p.commitments||[]).map(norm)}:structuredClone(D)}catch{return structuredClone(D)}}function norm(c){return{title:'',promise:'',forWhom:'',dueDate:day(),domain:'Personal',evidence:'',accountabilityTo:'',nextAction:'',protectedTime:'',obstacle:'',dependency:'',status:'active',risks:[],...c,risks:Array.isArray(c.risks)?c.risks:[]}}function save(){localStorage.setItem(K,JSON.stringify(S))}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()}function day(){return new Date().toISOString().slice(0,10)}function e(v=''){return String(v).replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}function fd(v){return v?new Date(v+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'No date'}function fdt(v){return new Date(v).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function st(c){if(c.status==='closed'||c.status==='repaired'||c.status==='repair-open')return c.status;if(c.completedAt&&!c.reportedAt)return'did';if(c.dueDate<day()&&!c.completedAt)return'overdue';if((c.risks||[]).some(x=>x.open))return'risk';return'active'}function sl(s){return{active:'Ready to do',risk:'Needs support',did:'Ready to report',overdue:'Needs repair','repair-open':'Repair in motion',closed:'Loop closed',repaired:'Repair completed'}[s]||s}function sc(s){return{active:'blue',risk:'gold',did:'violet',overdue:'rose','repair-open':'gold',closed:'green',repaired:'green'}[s]||''}function prog(s){return{active:25,risk:35,did:70,overdue:25,'repair-open':78,closed:100,repaired:100}[s]||0}function count(s){return S.commitments.filter(c=>st(c)===s).length}function hist(cid,title,detail){S.history.unshift({id:uid(),cid,title,detail,at:new Date().toISOString()});S.history=S.history.slice(0,300)}function coach(type,cid,summary){S.coach.unshift({id:uid(),type,cid,summary,at:new Date().toISOString()});S.coach=S.coach.slice(0,250)}
function dashboard(){let insight=getInsight();R.innerHTML=`<div class="stack"><section class="hero"><div><span class="eyebrow">CharacterArc Coach v1</span><h1>Clearer promises. <span>Truer reports.</span></h1><p>Clarify your Say, prepare your Do, examine your Did, complete your Said, and repair the gap without turning character into a score.</p><div class="actions"><button class="btn primary" id="new">Make a coached commitment</button><button class="btn secondary" id="hub">Open Coach Hub</button><button class="btn ghost" id="review">Today's review</button></div><div class="privacy">◆ Private by default. This coach runs on your device.</div></div><div class="principles"><div class="principle"><small>Say Coach</small><strong>Clarify the promise</strong></div><div class="principle"><small>Do Coach</small><strong>Surface risk early</strong></div><div class="principle"><small>Said Coach</small><strong>Report what happened</strong></div><div class="principle"><small>Repair Coach</small><strong>Restore responsible movement</strong></div></div></section><section class="grid4"><div class="metric"><small>Ready to do</small><strong>${count('active')}</strong><em>Clear commitments requiring action</em></div><div class="metric"><small>Needs support</small><strong>${count('risk')}</strong><em>Risk made visible before failure</em></div><div class="metric"><small>Ready to report</small><strong>${count('did')}</strong><em>Action occurred; accountability remains</em></div><div class="metric"><small>Open repairs</small><strong>${count('overdue')+count('repair-open')}</strong><em>Gaps requiring responsible repair</em></div></section><section class="panel"><div class="head"><div><span class="eyebrow">The Coach Constitution</span><h2>Evidence before interpretation</h2></div><p>The coach recommends. You decide.</p></div><div class="coach-grid">${feature('quality','01','Commitment Quality Review','Improve clarity, observability, scope, ownership, and readiness.','Review a Say')}${feature('risk','02','At-Risk Check-In','Choose a responsible response while options still exist.','Surface a risk')}${feature('report','03','Accountable Report Writer','Turn facts into a clear completion or gap report.','Write a report')}${feature('repair','04','Repair Guide','Acknowledge impact and name the next credible action.','Begin repair')}</div></section><section class="panel"><span class="eyebrow">Coach observation</span><div class="head"><div><h2>${e(insight[0])}</h2><p>${e(insight[1])}</p></div><div class="metric"><strong>${S.coach.length}</strong><em>coach sessions</em></div></div></section><section class="panel"><div class="head"><div><span class="eyebrow">The Trust Loop</span><h2>Clarify → Prepare → Examine → Report → Repair</h2></div></div><div class="loop">${loop(1,'Clarify the Say','Make it observable, owned, bounded, and honest.')}${loop(2,'Prepare the Do','Name the next action, time, dependency, and obstacle.')}${loop(3,'Examine the Did','Record what occurred before interpreting it.')}${loop(4,'Complete the Said','Report the result, gap, and next action.')}${loop(5,'Repair the Gap','Restore truth and responsible movement.')}</div></section><section class="panel"><div class="head"><div><span class="eyebrow">Active practice</span><h2>Your commitments</h2></div><select id="filter" class="btn secondary"><option value="open">Open</option><option value="all">All</option><option value="risk">Needs support</option><option value="report">Ready to report</option><option value="repair">Needs repair</option><option value="closed">Closed</option></select></div><div id="list" class="list"></div></section><section class="panel"><div class="head"><div><span class="eyebrow">Recent truth</span><h2>Activity history</h2></div></div><div class="timeline">${timeline()}</div></section></div>`;document.getElementById('new').onclick=()=>commitModal();document.getElementById('hub').onclick=hub;document.getElementById('review').onclick=daily;document.getElementById('filter').onchange=x=>renderList(x.target.value);document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>openFeature(b.dataset.feature));renderList('open')}
function feature(k,n,t,d,a){return`<article class="coach-card"><span class="num">${n}</span><h3>${t}</h3><p>${d}</p><button class="text-btn" data-feature="${k}">${a} →</button></article>`}function loop(n,t,d){return`<div class="loop-step"><b>${n}</b><strong>${t}</strong><p>${d}</p></div>`}function getInsight(){if(!S.commitments.length)return['Start with one promise worth keeping.','The coach becomes useful when one real commitment becomes specific and observable.'];if(count('did'))return[`${count('did')} action${count('did')===1?'':'s'} happened but the loop remains open.`,'Accountability closes when what was done becomes truthfully reportable.'];if(count('overdue')+count('repair-open'))return[`${count('overdue')+count('repair-open')} commitment${count('overdue')+count('repair-open')===1?'':'s'} need repair.`,'Repair does not erase the gap; it creates the next truthful action.'];let v=S.commitments.filter(c=>quality(c).issues.length>=3).length;if(v)return[`${v} commitment${v===1?'':'s'} could be more observable.`,'Clarifying the Say early reduces ambiguity when you examine the Did.'];return['Your current loops show no visible unresolved gap.','Continue preserving clarity before pressure rises.']}
function renderList(f){let a=[...S.commitments].sort((x,y)=>x.dueDate.localeCompare(y.dueDate));if(f==='open')a=a.filter(c=>!['closed','repaired'].includes(st(c)));if(f==='risk')a=a.filter(c=>st(c)==='risk');if(f==='report')a=a.filter(c=>st(c)==='did');if(f==='repair')a=a.filter(c=>['overdue','repair-open'].includes(st(c)));if(f==='closed')a=a.filter(c=>['closed','repaired'].includes(st(c)));let l=document.getElementById('list');if(!a.length){l.innerHTML='<div class="empty">No commitments in this view.</div>';return}l.innerHTML=a.map(c=>{let s=st(c),q=quality(c),ca=s==='did'?'report':(['overdue','repair-open'].includes(s)?'repair':s==='risk'?'risk':'quality'),cl=s==='did'?'Write report':(['overdue','repair-open'].includes(s)?'Repair guide':s==='risk'?'Risk coach':'Coach this');return`<article class="commit"><h3>${e(c.title)}</h3><div class="meta"><span class="chip ${sc(s)}">${sl(s)}</span><span class="chip">Due ${fd(c.dueDate)}</span><span class="chip">${e(c.domain)}</span><span class="chip ${q.issues.length?'':'green'}">${q.issues.length?q.issues.length+' clarification'+(q.issues.length===1?'':'s'):'Clear Say'}</span></div><div class="body">${e(c.promise)}${c.forWhom?`<br><small>For: ${e(c.forWhom)}</small>`:''}${c.nextAction?`<br><small>Next: ${e(c.nextAction)}</small>`:''}</div><div class="progress"><span style="width:${prog(s)}%"></span></div><div class="commit-actions">${['active','risk'].includes(s)?`<button class="btn primary" data-act="did" data-id="${c.id}">Record what happened</button>`:''}${s==='did'?`<button class="btn primary" data-act="report" data-id="${c.id}">Write report</button>`:''}${s==='overdue'?`<button class="btn danger" data-act="repair" data-id="${c.id}">Begin repair</button>`:''}${s==='repair-open'?`<button class="btn primary" data-act="finish" data-id="${c.id}">Complete repair</button>`:''}<button class="btn coach" data-act="${ca}" data-id="${c.id}">${cl}</button><button class="btn secondary" data-act="view" data-id="${c.id}">History</button>${!['closed','repaired'].includes(s)?`<button class="btn ghost" data-act="edit" data-id="${c.id}">Edit</button>`:''}</div></article>`}).join('');l.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id))}
function act(a,i){let c=S.commitments.find(x=>x.id===i);if(!c)return;if(a==='did')did(c);if(a==='report')report(c);if(a==='repair')repair(c);if(a==='risk')risk(c);if(a==='quality')commitModal(c,true);if(a==='edit')commitModal(c);if(a==='view')view(c);if(a==='finish')finishRepair(c)}
function modal(html){close();let m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<section class="modal-card">${html}</section>`;document.body.append(m);m.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);m.onclick=x=>{if(x.target===m)close()}}function close(){document.getElementById('modal')?.remove()}
function commitModal(c=null,auto=false){let x=c||{title:'',promise:'',forWhom:'',dueDate:day(),domain:'Personal',evidence:'',accountabilityTo:'',nextAction:'',protectedTime:'',obstacle:'',dependency:''};modal(`<span class="eyebrow">Say Coach</span><h2>${c?'Refine':'Make'} a commitment</h2><p>Make the promise visible in action and credible under real conditions.</p><form id="cf"><div class="form"><div class="field full"><label>Title</label><input name="title" required maxlength="80" value="${e(x.title)}"></div><div class="field full"><label>Exact promise</label><textarea name="promise" required placeholder="I will...">${e(x.promise)}</textarea></div><div class="field"><label>For whom or what need?</label><input name="forWhom" value="${e(x.forWhom)}"></div><div class="field"><label>Due date</label><input type="date" name="dueDate" required value="${x.dueDate}"></div><div class="field"><label>Domain</label><select name="domain">${['Personal','Relational','Work','Service','Health','Faith'].map(d=>`<option ${d===x.domain?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Accountability recipient</label><input name="accountabilityTo" value="${e(x.accountabilityTo)}"></div><div class="field full"><label>Evidence of completion</label><input name="evidence" value="${e(x.evidence)}" placeholder="What will show it was done?"></div><div class="field full"><label>Next physical action</label><input name="nextAction" value="${e(x.nextAction)}"></div><div class="field"><label>Protected time or trigger</label><input name="protectedTime" value="${e(x.protectedTime)}"></div><div class="field"><label>Likely obstacle</label><input name="obstacle" value="${e(x.obstacle)}"></div><div class="field full"><label>Dependency</label><input name="dependency" value="${e(x.dependency)}"></div></div><div id="qr" class="result hidden"></div><div class="modal-actions spread"><button type="button" class="btn coach" id="qbtn">Review with Coach</button><div><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn primary">Save</button></div></div></form>`);let f=document.getElementById('cf');document.getElementById('qbtn').onclick=()=>showQuality(Object.fromEntries(new FormData(f)),f);if(auto)setTimeout(()=>document.getElementById('qbtn').click(),30);f.onsubmit=z=>{z.preventDefault();let d=Object.fromEntries(new FormData(f)),q=quality(d);if(c){Object.assign(c,d);hist(c.id,'Commitment updated',d.promise)}else{c=norm({id:uid(),...d,createdAt:new Date().toISOString()});S.commitments.push(c);hist(c.id,'Commitment made',c.promise)}coach('quality',c.id,q.summary);save();close();dashboard()}}
function quality(c){let issues=[],p=(c.promise||'').trim(),lo=p.toLowerCase();if(!p)issues.push('Name the exact action.');else if(!/^i\s+(will|commit to|am going to)\b/i.test(p))issues.push('Use first-person ownership, such as “I will…”');let v=['work on','try to','think about','improve','handle','address','do better','figure out','get to'].find(z=>lo.includes(z));if(v)issues.push(`“${v}” may hide the observable result.`);if(!c.dueDate)issues.push('Add a date.');if(!String(c.evidence||'').trim())issues.push('Define observable evidence of completion.');if(!String(c.forWhom||'').trim())issues.push('Name the person, purpose, or need served.');if(!String(c.nextAction||'').trim())issues.push('Name the next physical action.');if(!String(c.protectedTime||'').trim())issues.push('Name when action begins or what triggers it.');if((p.match(/\b(and|also|then|plus)\b/gi)||[]).length>=3)issues.push('This may contain several promises; reduce the scope.');let summary=!issues.length?'The commitment is clear, observable, owned, time-bound, and prepared.':issues.length<=2?'Strong foundation with a small number of clarification needs.':'The intention is visible, but the Say needs more definition.';return{issues,summary,suggest:suggest(c)}}function suggest(c){let p=(c.promise||'').trim().replace(/^i\s+(will|commit to|am going to)\s+/i,'').replace(/[.]$/,'');if(!p)return'';return`${c.dueDate?'By '+fd(c.dueDate)+', ':''}I will ${p}.${c.evidence?' Completion will be visible when '+c.evidence.replace(/[.]$/,'')+'.':''}${c.forWhom?' This serves '+c.forWhom.replace(/[.]$/,'')+'.':''}`}
function showQuality(d,f){let q=quality(d),r=document.getElementById('qr');r.classList.remove('hidden');r.innerHTML=`<span class="eyebrow">Coach observation</span><h3>${q.issues.length?`${q.issues.length} clarification${q.issues.length===1?'':'s'}`:'Ready to make'}</h3><p>${e(q.summary)}</p>${q.issues.map(i=>`<div class="signal"><span>!</span><p>${e(i)}</p></div>`).join('')}${q.suggest?`<div class="draft"><small>Suggested wording</small><p>${e(q.suggest)}</p><button type="button" class="text-btn" id="apply">Use this wording →</button></div>`:''}`;document.getElementById('apply')?.addEventListener('click',()=>{f.elements.promise.value=q.suggest})}
function openFeature(k){let a=S.commitments.filter(c=>{let s=st(c);if(k==='quality')return!['closed','repaired'].includes(s);if(k==='risk')return['active','risk'].includes(s);if(k==='report')return s!=='repaired';if(k==='repair')return['overdue','repair-open'].includes(s)});if(k==='quality'&&!a.length)return commitModal(null,true);if(!a.length)return modal(`<span class="eyebrow">Coach</span><h2>No matching commitment</h2><p>There is no commitment available for this coaching mode.</p><div class="modal-actions"><button class="btn primary" data-close>Close</button></div>`);modal(`<span class="eyebrow">Coach</span><h2>Choose a commitment</h2><p>The coach will use only its visible facts.</p><div class="picker">${a.map(c=>`<button class="pick" data-pick="${c.id}"><span><strong>${e(c.title)}</strong><small>${e(c.promise)}</small></span><b>→</b></button>`).join('')}</div>`);document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let c=S.commitments.find(x=>x.id===b.dataset.pick);close();if(k==='quality')commitModal(c,true);if(k==='risk')risk(c);if(k==='report')report(c);if(k==='repair')repair(c)})}
function risk(c){modal(`<span class="eyebrow">Do Coach</span><h2>Surface risk before failure</h2><p>Choose a responsible response while options still exist.</p><form id="rf"><div class="form"><div class="field"><label>Primary risk</label><select name="reason"><option>Available time changed</option><option>A dependency is unresolved</option><option>Scope is larger than expected</option><option>A legitimate priority collided</option><option>Capacity or energy changed</option><option>I have been avoiding the action</option><option>The commitment is unclear</option></select></div><div class="field"><label>Responsible response</label><select name="response"><option>Continue with an adjustment</option><option>Reduce the scope</option><option>Request help</option><option>Communicate risk now</option><option>Renegotiate the commitment</option><option>Close responsibly</option></select></div><div class="field full"><label>What changed?</label><textarea name="details" required></textarea></div><div class="field"><label>Who should know?</label><input name="recipient" value="${e(c.accountabilityTo)}"></div><div class="field"><label>Proposed new date</label><input type="date" name="newDate"></div></div><div class="modal-actions spread"><button type="button" class="btn coach" id="rd">Generate update</button><div><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn primary">Save check-in</button></div></div><div id="rout" class="result hidden"></div></form>`);let f=document.getElementById('rf');document.getElementById('rd').onclick=()=>draftBox('rout',riskDraft(c,Object.fromEntries(new FormData(f))));f.onsubmit=z=>{z.preventDefault();let d=Object.fromEntries(new FormData(f)),draft=riskDraft(c,d);c.risks.push({id:uid(),...d,draft,open:true,at:new Date().toISOString()});if(d.newDate&&d.response.includes('Renegotiate'))c.dueDate=d.newDate;hist(c.id,'Risk surfaced before the deadline',d.details);coach('risk',c.id,d.details);save();close();dashboard()}}
function riskDraft(c,d){return`Quick update on “${c.title}”: I said I would ${strip(c.promise)} by ${fd(c.dueDate)}. This is now at risk because ${sentence(d.details)} My responsible response is to ${String(d.response).toLowerCase()}.${d.newDate?' I propose '+fd(d.newDate)+' as the revised date.':''} I am communicating this before the deadline so the gap is visible while there is still time to act.`}
function did(c){modal(`<span class="eyebrow">Did Coach</span><h2>Record what actually happened</h2><p>Begin with observable facts before interpretation.</p><form id="df"><div class="field"><label>What action occurred?</label><textarea name="facts" required></textarea></div><div class="form"><div class="field"><label>Date</label><input type="date" name="date" value="${day()}" required></div><div class="field"><label>Result</label><select name="result"><option value="completed">Completed</option><option value="different">Completed differently</option><option value="partial">Partially completed</option><option value="not">Not completed</option></select></div></div><div class="modal-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Continue to report</button></div></form>`);document.getElementById('df').onsubmit=z=>{z.preventDefault();let d=Object.fromEntries(new FormData(z.target));c.didNote=d.facts;c.didResult=d.result;if(['completed','different','partial'].includes(d.result))c.completedAt=d.date;hist(c.id,'What happened was recorded',d.facts);save();close();report(c,d)}}
function report(c,seed={}){modal(`<span class="eyebrow">Said Coach</span><h2>Write an accountable report</h2><p>State what happened, the result, the remaining gap, and the next responsible action.</p><form id="pf"><div class="form"><div class="field"><label>Outcome</label><select name="outcome">${[['completed','Completed as said'],['different','Completed differently'],['partial','Partially completed'],['not','Not completed'],['closed','No longer appropriate']].map(x=>`<option value="${x[0]}" ${x[0]===(seed.result||c.didResult)?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Who receives it?</label><input name="recipient" value="${e(c.accountabilityTo)}"></div><div class="field full"><label>What actually happened?</label><textarea name="facts" required>${e(seed.facts||c.didNote||'')}</textarea></div><div class="field full"><label>What result did this produce?</label><textarea name="result" required></textarea></div><div class="field full"><label>What gap remains?</label><textarea name="gap"></textarea></div><div class="field full"><label>What affected the outcome?</label><textarea name="explanation"></textarea></div><div class="field full"><label>Next responsible action</label><textarea name="next"></textarea></div></div><div class="modal-actions spread"><button type="button" class="btn coach" id="pd">Generate report</button><div><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn primary">Save report</button></div></div><div id="pout" class="result hidden"></div></form>`);let f=document.getElementById('pf');document.getElementById('pd').onclick=()=>draftBox('pout',reportDraft(c,Object.fromEntries(new FormData(f))));f.onsubmit=z=>{z.preventDefault();let d=Object.fromEntries(new FormData(f)),draft=reportDraft(c,d);c.reportedAt=day();c.report=draft;c.reportData=d;if(['completed','different'].includes(d.outcome)){c.completedAt=c.completedAt||day();c.status='closed';(c.risks||[]).forEach(x=>x.open=false);hist(c.id,'Trust loop closed',draft)}else{c.status='repair-open';hist(c.id,'Gap truthfully reported',draft)}coach('report',c.id,draft);save();close();dashboard()}}
function reportDraft(c,d){let a=[`I said I would ${strip(c.promise)} by ${fd(c.dueDate)}.`,`What I actually did was: ${sentence(d.facts)}`,`The result was: ${sentence(d.result)}`];if(d.gap.trim())a.push(`The remaining gap is: ${sentence(d.gap)}`);if(d.explanation.trim())a.push(`What affected the outcome was: ${sentence(d.explanation)}`);if(d.next.trim())a.push(`My next responsible action is: ${sentence(d.next)}`);return a.join(' ')}
function repair(c){modal(`<span class="eyebrow">Repair Coach</span><h2>Restore responsible movement</h2><p>Repair does not rewrite the original history.</p><form id="xf">${rstep(1,'Acknowledge the gap','gap',c.reportData?.gap||'')}${rstep(2,'Who or what was affected?','impact','')}${rstep(3,'What can be corrected now?','correction','')}${rstep(4,'What needs to be communicated?','communication','')}${rstep(5,'What is the next credible commitment?','next','')}<div class="form"><div class="field"><label>Who receives the repair?</label><input name="recipient" value="${e(c.accountabilityTo)}"></div><div class="field"><label>Target date</label><input type="date" name="date" value="${day()}" required></div></div><div class="modal-actions spread"><button type="button" class="btn coach" id="xd">Generate repair message</button><div><button type="button" class="btn ghost" data-close>Cancel</button> <button class="btn primary">Save repair plan</button></div></div><div id="xout" class="result hidden"></div></form>`);let f=document.getElementById('xf');document.getElementById('xd').onclick=()=>draftBox('xout',repairDraft(c,Object.fromEntries(new FormData(f))));f.onsubmit=z=>{z.preventDefault();let d=Object.fromEntries(new FormData(f)),draft=repairDraft(c,d);c.repair={...d,draft,startedAt:new Date().toISOString()};c.status='repair-open';c.reportedAt=c.reportedAt||day();(c.risks||[]).forEach(x=>x.open=false);hist(c.id,'Repair plan initiated',draft);coach('repair',c.id,draft);save();close();dashboard()}}
function rstep(n,l,name,v){return`<div class="repair-step"><span>${n}</span><div class="field"><label>${l}</label><textarea name="${name}" required>${e(v)}</textarea></div></div>`}function repairDraft(c,d){return`I want to repair the gap in “${c.title}.” I said I would ${strip(c.promise)} by ${fd(c.dueDate)}. What happened was: ${sentence(d.gap)} The impact was: ${sentence(d.impact)} What I can correct now is: ${sentence(d.correction)} I need to communicate: ${sentence(d.communication)} My next credible commitment is: ${sentence(d.next)} I am targeting ${fd(d.date)} for this repair action.`}
function finishRepair(c){modal(`<span class="eyebrow">Repair Coach</span><h2>Complete the repair record</h2><p>Record the restorative action that actually occurred.</p><form id="ff"><div class="field"><label>What repair action was completed?</label><textarea name="done" required></textarea></div><div class="field"><label>What remains?</label><textarea name="remaining"></textarea></div><div class="modal-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Complete repair</button></div></form>`);document.getElementById('ff').onsubmit=z=>{z.preventDefault();let d=Object.fromEntries(new FormData(z.target));c.repair={...(c.repair||{}),...d,completedAt:new Date().toISOString()};c.status='repaired';hist(c.id,'Repair completed',d.done);save();close();dashboard()}}
function view(c){let h=S.history.filter(x=>x.cid===c.id);modal(`<span class="eyebrow">Commitment record</span><h2>${e(c.title)}</h2><p>${e(c.promise)}</p><div class="record-grid"><div class="record"><small>Due</small><strong>${fd(c.dueDate)}</strong></div><div class="record"><small>Status</small><strong>${sl(st(c))}</strong></div><div class="record"><small>Evidence</small><strong>${e(c.evidence||'Not defined')}</strong></div><div class="record"><small>Next action</small><strong>${e(c.nextAction||'Not defined')}</strong></div></div><div class="timeline">${h.length?h.map(event).join(''):'<div class="empty">No history yet.</div>'}</div><div class="modal-actions"><button class="btn primary" data-close>Close</button></div>`)}function event(x){return`<div class="event"><span class="dot"></span><div><small>${fdt(x.at)}</small><p><strong>${e(x.title)}</strong><br>${e(x.detail)}</p></div></div>`}function timeline(){return S.history.length?S.history.slice(0,10).map(event).join(''):'<div class="empty">Your truthful activity record will appear here.</div>'}
function daily(){let a=S.commitments.filter(c=>!['closed','repaired'].includes(st(c))).slice(0,25);if(!a.length)return modal(`<span class="eyebrow">Daily review</span><h2>Nothing open today</h2><p>You have no active commitments to review.</p><div class="modal-actions"><button class="btn primary" data-close>Close</button></div>`);let i=0;function next(){let c=a[i];modal(`<span class="eyebrow">Daily review ${i+1} of ${a.length}</span><h2>${e(c.title)}</h2><p>${e(c.promise)}</p><div class="picker"><button class="pick" data-r="did"><span><strong>Action occurred</strong><small>Record the Did, then complete the Said.</small></span></button><button class="pick" data-r="progress"><span><strong>Credibly in progress</strong><small>The promise remains prepared and on track.</small></span></button><button class="pick" data-r="risk"><span><strong>It is at risk</strong><small>Surface changed conditions now.</small></span></button><button class="pick" data-r="repair"><span><strong>A gap has occurred</strong><small>Begin responsible repair.</small></span></button></div>`);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let v=b.dataset.r;close();if(v==='did')return did(c);if(v==='risk')return risk(c);if(v==='repair')return repair(c);hist(c.id,'Progress reviewed','The commitment remains credibly in progress.');save();i++;i<a.length?next():dashboard()})}next()}
function hub(){R.innerHTML=`<div class="stack"><section class="intro"><button class="back" id="back">← Dashboard</button><span class="eyebrow">CharacterArc Coach</span><h1>Choose the next responsible move.</h1><p>The coach is context-sensitive and remains bounded by visible commitment facts.</p></section><section class="coach-grid">${feature('quality','01','Commitment Quality Review','Clarify ownership, observability, scope, dependencies, and readiness.','Start review')}${feature('risk','02','At-Risk Check-In','Surface changed conditions before the deadline.','Start check-in')}${feature('report','03','Accountable Report Writer','Separate what happened from explanation and next action.','Draft report')}${feature('repair','04','Repair Guide','Build a bounded repair without erasing the original gap.','Build repair')}</section><section class="panel"><div class="head"><div><span class="eyebrow">Boundaries</span><h2>What the coach will not do</h2></div></div><div class="coach-grid"><div class="boundary"><strong>No character verdicts</strong><p>It will not label a person honest or untrustworthy.</p></div><div class="boundary"><strong>No automatic messages</strong><p>Every generated report remains a draft.</p></div><div class="boundary"><strong>No hidden profiling</strong><p>Observations come from facts you can see.</p></div><div class="boundary"><strong>No moral score</strong><p>The app tracks movements, not worth.</p></div></div></section></div>`;document.getElementById('back').onclick=dashboard;document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>openFeature(b.dataset.feature))}
function draftBox(id,text){let o=document.getElementById(id);o.classList.remove('hidden');o.innerHTML=`<div class="draft"><small>Coach-generated draft</small><p>${e(text)}</p><button type="button" class="text-btn" id="copy">Copy draft →</button></div>`;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text);document.getElementById('copy').textContent='Copied'}catch{document.getElementById('copy').textContent='Select and copy manually'}}}function strip(v=''){return String(v).trim().replace(/^i\s+(will|commit to|am going to)\s+/i,'').replace(/[.]$/,'')}function sentence(v=''){v=String(v).trim();return/[.!?]$/.test(v)?v:v+'.'}save();dashboard();
</script></body></html>
