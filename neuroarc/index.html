<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeuroArc" />
  <meta name="description" content="NeuroArc daily brain training games." />
  <title>NeuroArc — Daily Brain Training</title>
  <style>:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f8f8ff;
  background: #080912;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --panel: rgba(19, 21, 39, 0.72);
  --panel-strong: rgba(25, 27, 49, 0.92);
  --line: rgba(255, 255, 255, 0.09);
  --muted: #a3a7bd;
  --violet: #9b7cff;
  --violet-bright: #bca8ff;
  --cyan: #41d7e8;
  --gold: #f0ba52;
  --rose: #f27a9d;
  --green: #72df9c;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  background: #080912;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(155, 124, 255, 0.48);
  outline-offset: 3px;
}

.app-shell {
  position: relative;
  min-height: 100vh;
  isolation: isolate;
}

.ambient {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  background:
    radial-gradient(circle at 45% 10%, rgba(82, 49, 155, 0.18), transparent 38%),
    linear-gradient(180deg, #0b0c18 0%, #070810 72%);
}

.orb {
  position: absolute;
  border-radius: 999px;
  filter: blur(20px);
  opacity: 0.32;
}

.orb-one {
  width: 420px;
  height: 420px;
  top: -220px;
  left: -140px;
  background: rgba(71, 48, 144, 0.55);
}

.orb-two {
  width: 340px;
  height: 340px;
  right: -170px;
  top: 190px;
  background: rgba(16, 121, 143, 0.22);
}

.grid-haze {
  position: absolute;
  inset: 0;
  opacity: 0.15;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: linear-gradient(to bottom, black, transparent 78%);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 78px;
  padding: 14px clamp(18px, 5vw, 72px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  background: rgba(8, 9, 18, 0.72);
  backdrop-filter: blur(22px);
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  text-align: left;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(188, 168, 255, 0.26);
  border-radius: 13px;
  background: linear-gradient(145deg, rgba(155,124,255,0.27), rgba(48,38,88,0.34));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 10px 35px rgba(76,49,151,0.18);
  font-size: 20px;
  font-weight: 800;
  color: var(--violet-bright);
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-size: 16px;
  letter-spacing: 0.01em;
}

.brand small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
}

.profile-mini {
  display: flex;
  align-items: center;
  gap: 16px;
}

.profile-level {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.11);
  background: rgba(255,255,255,0.05);
  color: var(--violet-bright);
  font-size: 13px;
  font-weight: 800;
}

.profile-xp {
  min-width: 130px;
}

.profile-xp-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
  color: #d8d9e3;
  font-size: 11px;
}

.progress-track {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
}

.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #8262f2, #ba9eff);
  box-shadow: 0 0 14px rgba(155,124,255,0.6);
}

.main-content {
  width: min(1180px, calc(100% - 36px));
  margin: 0 auto;
  padding: clamp(30px, 5vw, 64px) 0 64px;
}

.dashboard {
  display: grid;
  gap: 32px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.8fr);
  gap: 30px;
  align-items: stretch;
}

.hero-copy,
.hero-panel,
.game-card,
.insight-card,
.game-shell,
.results-card {
  border: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(24px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 20px 80px rgba(0,0,0,0.19);
}

.hero-copy {
  border-radius: 28px;
  padding: clamp(28px, 5vw, 54px);
  background:
    linear-gradient(135deg, rgba(92,57,180,0.16), transparent 58%),
    var(--panel);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--violet-bright);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.eyebrow::before {
  content: "";
  width: 18px;
  height: 1px;
  background: currentColor;
  opacity: 0.75;
}

.hero h1,
.game-title h1,
.results-card h1 {
  margin: 16px 0 14px;
  max-width: 760px;
  font-size: clamp(38px, 6vw, 70px);
  line-height: 0.98;
  letter-spacing: -0.055em;
}

.hero h1 span {
  color: var(--violet-bright);
}

.hero p {
  max-width: 650px;
  margin: 0;
  color: #b5b7c8;
  font-size: clamp(15px, 2vw, 18px);
  line-height: 1.7;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.primary-button,
.secondary-button,
.ghost-button {
  min-height: 46px;
  border-radius: 13px;
  border: 1px solid transparent;
  padding: 0 19px;
  font-weight: 750;
  cursor: pointer;
  transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
}

.primary-button {
  background: linear-gradient(135deg, #8d6bf1, #6a4cd1);
  box-shadow: 0 11px 28px rgba(92, 61, 194, 0.3), inset 0 1px 0 rgba(255,255,255,0.3);
}

.secondary-button {
  border-color: rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.055);
}

.ghost-button {
  border-color: rgba(255,255,255,0.08);
  background: transparent;
  color: #b9bbca;
}

.primary-button:hover,
.secondary-button:hover,
.ghost-button:hover,
.game-card:hover {
  transform: translateY(-2px);
}

.hero-panel {
  min-height: 270px;
  border-radius: 28px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  position: relative;
}

.hero-panel::after {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  right: -65px;
  bottom: -95px;
  border-radius: 50%;
  background: rgba(110,76,213,0.17);
  filter: blur(8px);
}

.daily-ring {
  width: 132px;
  height: 132px;
  margin: 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--violet) var(--daily-progress), rgba(255,255,255,0.075) 0);
  position: relative;
}

.daily-ring::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  background: #141627;
  border: 1px solid rgba(255,255,255,0.07);
}

.daily-ring-content {
  position: relative;
  z-index: 1;
  text-align: center;
}

.daily-ring-content strong,
.daily-ring-content small {
  display: block;
}

.daily-ring-content strong {
  font-size: 30px;
  letter-spacing: -0.04em;
}

.daily-ring-content small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.streak-row {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 14px;
  position: relative;
  z-index: 1;
}

.streak-row small,
.metric small,
.result-metrics small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.11em;
}

.streak-row strong {
  font-size: 24px;
}

.section-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 22px;
}

.section-header h2 {
  margin: 7px 0 0;
  font-size: clamp(24px, 3vw, 34px);
  letter-spacing: -0.035em;
}

.section-header p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.game-card {
  min-height: 260px;
  padding: 22px;
  border-radius: 21px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
}

.game-card:hover {
  border-color: rgba(188,168,255,0.28);
  background: var(--panel-strong);
}

.game-icon,
.result-badge {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 22px;
  border: 1px solid rgba(255,255,255,0.1);
}

.violet { background: rgba(155,124,255,0.15); color: #beaaff; }
.cyan { background: rgba(65,215,232,0.12); color: #70e6f2; }
.gold { background: rgba(240,186,82,0.12); color: #ffd47e; }
.rose { background: rgba(242,122,157,0.12); color: #ff9ebb; }

.game-card .domain {
  margin-top: 25px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: 0.11em;
}

.game-card h3 {
  margin: 8px 0 8px;
  font-size: 20px;
}

.game-card p {
  margin: 0;
  color: #aeb0c0;
  line-height: 1.55;
  font-size: 13px;
}

.game-card-footer {
  margin-top: auto;
  padding-top: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #d8d9e4;
  font-size: 12px;
}

.game-card-footer b {
  color: var(--violet-bright);
}

.insight-row {
  display: grid;
  grid-template-columns: 1.4fr 0.8fr;
  gap: 16px;
}

.insight-card {
  border-radius: 21px;
  padding: 22px;
}

.insight-card h3 {
  margin: 0 0 18px;
  font-size: 16px;
}

.week-bars {
  height: 120px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  align-items: end;
}

.day-bar {
  min-height: 26px;
  border-radius: 9px 9px 4px 4px;
  background: linear-gradient(180deg, #8f70ed, #4e387e);
  position: relative;
}

.day-bar.empty {
  background: rgba(255,255,255,0.05);
}

.day-bar span {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--muted);
  font-size: 10px;
}

.quick-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.metric {
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.035);
  padding: 17px;
  border-radius: 15px;
}

.metric strong {
  display: block;
  margin-top: 6px;
  font-size: 24px;
  letter-spacing: -0.035em;
}

.game-screen,
.results-screen {
  display: grid;
  min-height: calc(100vh - 150px);
  place-items: center;
}

.game-shell {
  width: min(820px, 100%);
  border-radius: 28px;
  padding: clamp(22px, 5vw, 42px);
}

.game-topline {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
}

.game-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.game-meta .game-icon {
  width: 40px;
  height: 40px;
  font-size: 18px;
}

.game-meta strong,
.game-meta small {
  display: block;
}

.game-meta small {
  color: var(--muted);
  margin-top: 2px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.game-stats {
  display: flex;
  gap: 10px;
}

.stat-pill {
  min-width: 74px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.045);
  border: 1px solid rgba(255,255,255,0.07);
  text-align: center;
}

.stat-pill small,
.stat-pill strong {
  display: block;
}

.stat-pill small {
  color: var(--muted);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.stat-pill strong {
  margin-top: 4px;
  font-size: 17px;
}

.round-progress {
  height: 4px;
  margin: 26px 0 32px;
  background: rgba(255,255,255,0.07);
  border-radius: 999px;
  overflow: hidden;
}

.round-progress span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #7558dd, #b69cff);
  border-radius: inherit;
}

.game-stage {
  min-height: 410px;
  display: grid;
  place-items: center;
  text-align: center;
}

.game-title h1 {
  font-size: clamp(32px, 6vw, 54px);
}

.game-title p {
  margin: 0;
  color: var(--muted);
  line-height: 1.65;
}

.start-panel {
  max-width: 530px;
}

.start-panel .primary-button {
  margin-top: 26px;
}

.memory-grid {
  width: min(430px, 100%);
  aspect-ratio: 1;
  display: grid;
  gap: 10px;
}

.memory-tile {
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 13px;
  background: rgba(255,255,255,0.045);
  cursor: pointer;
  transition: background 120ms ease, transform 120ms ease, box-shadow 120ms ease;
}

.memory-tile:hover {
  transform: scale(1.025);
}

.memory-tile.active {
  border-color: rgba(194,175,255,0.58);
  background: linear-gradient(145deg, #b69cff, #7858dd);
  box-shadow: 0 0 26px rgba(139,102,231,0.5), inset 0 1px 0 rgba(255,255,255,0.45);
}

.memory-tile.selected {
  border-color: rgba(188,168,255,0.45);
  background: rgba(155,124,255,0.32);
}

.stage-label {
  margin-bottom: 18px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.focus-word {
  min-height: 100px;
  font-size: clamp(56px, 13vw, 104px);
  font-weight: 900;
  letter-spacing: -0.05em;
  text-transform: uppercase;
  text-shadow: 0 12px 40px rgba(0,0,0,0.35);
}

.answer-grid {
  width: min(500px, 100%);
  margin-top: 34px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.answer-button {
  min-height: 58px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.09);
  background: rgba(255,255,255,0.048);
  cursor: pointer;
  font-weight: 750;
  transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
}

.answer-button:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.075);
  border-color: rgba(255,255,255,0.16);
}

.feedback {
  height: 30px;
  margin-top: 18px;
  font-size: 13px;
  font-weight: 700;
}

.feedback.good { color: var(--green); }
.feedback.bad { color: #ff8c9d; }

.sequence {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 34px;
}

.sequence span {
  min-width: 74px;
  height: 72px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.045);
  font-size: clamp(22px, 4vw, 31px);
  font-weight: 800;
}

.sequence span.missing {
  border-color: rgba(240,186,82,0.35);
  color: var(--gold);
  background: rgba(240,186,82,0.08);
}

.math-question {
  font-size: clamp(50px, 10vw, 86px);
  font-weight: 850;
  letter-spacing: -0.06em;
}

.math-form {
  width: min(360px, 100%);
  margin-top: 34px;
  display: flex;
  gap: 10px;
}

.math-form input {
  min-width: 0;
  flex: 1;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.055);
  color: white;
  padding: 0 17px;
  font-size: 20px;
}

.results-card {
  width: min(620px, 100%);
  border-radius: 28px;
  padding: clamp(28px, 6vw, 54px);
  text-align: center;
}

.result-badge {
  width: 62px;
  height: 62px;
  margin: 0 auto 22px;
  font-size: 28px;
}

.results-card .eyebrow::before {
  display: none;
}

.results-card h1 {
  font-size: clamp(34px, 6vw, 56px);
}

.results-card > p {
  margin: 0 auto;
  max-width: 470px;
  color: var(--muted);
  line-height: 1.65;
}

.result-metrics {
  margin: 34px 0 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.result-metrics > div {
  padding: 18px 10px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.035);
}

.result-metrics strong {
  display: block;
  margin-top: 6px;
  font-size: 23px;
}

.best-line {
  display: flex;
  justify-content: space-between;
  padding: 15px 17px;
  border-radius: 13px;
  background: rgba(155,124,255,0.08);
  color: #d8d5e6;
  font-size: 13px;
}

.best-line b {
  color: var(--violet-bright);
}

.result-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 26px;
}

@media (max-width: 980px) {
  .game-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .hero {
    grid-template-columns: 1fr;
  }

  .hero-panel {
    min-height: 230px;
  }
}

@media (max-width: 700px) {
  .topbar {
    min-height: 68px;
    padding-inline: 16px;
  }

  .profile-xp {
    display: none;
  }

  .main-content {
    width: min(100% - 24px, 1180px);
    padding-top: 22px;
  }

  .hero-copy,
  .hero-panel,
  .game-shell,
  .results-card {
    border-radius: 22px;
  }

  .hero-copy {
    padding: 29px 22px;
  }

  .hero h1 {
    font-size: 44px;
  }

  .game-grid,
  .insight-row {
    grid-template-columns: 1fr;
  }

  .game-card {
    min-height: 225px;
  }

  .section-header {
    align-items: start;
    flex-direction: column;
    gap: 8px;
  }

  .game-topline {
    align-items: start;
  }

  .game-stats {
    gap: 6px;
  }

  .stat-pill {
    min-width: 62px;
    padding: 9px 8px;
  }

  .game-stage {
    min-height: 370px;
  }

  .memory-grid {
    gap: 7px;
  }

  .memory-tile {
    border-radius: 9px;
  }

  .sequence span {
    min-width: 60px;
    height: 62px;
  }
}

@media (max-width: 460px) {
  .brand small {
    display: none;
  }

  .hero-actions,
  .result-actions,
  .math-form {
    flex-direction: column;
  }

  .hero-actions button,
  .result-actions button,
  .math-form button {
    width: 100%;
  }

  .math-form input {
    min-height: 54px;
  }

  .result-metrics {
    grid-template-columns: 1fr;
  }

  .focus-word {
    font-size: 58px;
  }
}

  *, *::before, *::after {
